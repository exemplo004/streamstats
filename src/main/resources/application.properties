spring.application.name=streamstats

# Configuração do banco de dados com ${VAR:valor-padrao} que usa variável de ambiente ou o padrão
# Banco MySQL como dito na aula pode sobrescrever com variáveis de ambiente DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/streamstats?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate para criar e atualizar as tabelas a partir das entidades
# O Hibernate vai mapear as classes @Entity para tabelas relacionais
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
